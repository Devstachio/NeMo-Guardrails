# Example configuration for NeMo Guardrails
models:
  - type: main
    engine: openai
    model: gpt-3.5-turbo-instruct
    parameters:
      # Add your OpenAI API key here or set OPENAI_API_KEY environment variable
      # api_key: "your-api-key-here"

rails:
  input:
    flows:
      - self check input

  output:
    flows:
      - self check output

  config:
    # Enable self-checking rails
    self_check_input:
      enabled: true
    self_check_output:
      enabled: true
